events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=static:10m rate=50r/s;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Upstream servers
    upstream auth_backend {
        least_conn;
        server auth-service:8013 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream catalog_backend {
        least_conn;
        server catalog-service:8012 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream booking_backend {
        least_conn;
        server booking-service:8014 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream payment_backend {
        least_conn;
        server payment-service:8015 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream realtime_backend {
        least_conn;
        server realtime-service:8016 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Main server block (HTTP - redirect to HTTPS)
    server {
        listen 80;
        server_name bookmymovie.com www.bookmymovie.com;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name bookmymovie.com www.bookmymovie.com;

        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Static files
        location / {
            limit_req zone=static burst=20 nodelay;
            root /var/www/html;
            try_files $uri $uri/ /index.html;
            expires 1h;
        }

        # API Gateway - Auth Service
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            
            # Remove /api from the path before forwarding
            rewrite ^/api/auth/(.*) /$1 break;
            
            proxy_pass http://auth_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Catalog Service
        location /api/catalog/ {
            limit_req zone=api burst=10 nodelay;
            
            rewrite ^/api/catalog/(.*) /$1 break;
            
            proxy_pass http://catalog_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Caching for catalog data
            proxy_cache_valid 200 302 5m;
            proxy_cache_valid 404 1m;
        }

        # Booking Service
        location /api/booking/ {
            limit_req zone=api burst=10 nodelay;
            
            rewrite ^/api/booking/(.*) /$1 break;
            
            proxy_pass http://booking_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Payment Service
        location /api/payment/ {
            limit_req zone=api burst=5 nodelay;
            
            rewrite ^/api/payment/(.*) /$1 break;
            
            proxy_pass http://payment_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Strict security for payment endpoints
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # Real-time Service (WebSocket support)
        location /api/realtime/ {
            limit_req zone=api burst=10 nodelay;
            
            rewrite ^/api/realtime/(.*) /$1 break;
            
            proxy_pass http://realtime_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket specific settings
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Block access to sensitive files
        location ~ /\.ht {
            deny all;
        }
        
        location ~ /\.(git|svn) {
            deny all;
        }
    }

    # Admin interface (separate server block for additional security)
    server {
        listen 443 ssl http2;
        server_name admin.bookmymovie.com;

        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Additional security for admin
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # Admin interface
        location / {
            limit_req zone=auth burst=3 nodelay;
            
            root /var/www/html;
            try_files /admin.html =404;
        }

        # Admin API endpoints
        location /api/ {
            limit_req zone=auth burst=3 nodelay;
            
            # Basic authentication or IP restriction can be added here
            # auth_basic "Admin Area";
            # auth_basic_user_file /etc/nginx/.htpasswd;
            
            proxy_pass http://auth_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Monitoring endpoints (internal access only)
    server {
        listen 8090;
        server_name localhost;
        
        location /nginx-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # Docker networks
            deny all;
        }
    }
}