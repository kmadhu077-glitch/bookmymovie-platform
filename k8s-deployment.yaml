---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookmymovie-ingress
  namespace: bookmymovie
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - bookmymovie.com
    - api.bookmymovie.com
    secretName: bookmymovie-tls
  rules:
  - host: bookmymovie.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: auth-service  # Frontend served by auth service
            port:
              number: 8013
  - host: api.bookmymovie.com
    http:
      paths:
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8013
      - path: /catalog
        pathType: Prefix
        backend:
          service:
            name: catalog-service
            port:
              number: 8012
      - path: /booking
        pathType: Prefix
        backend:
          service:
            name: booking-service
            port:
              number: 8014
      - path: /payment
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 8015
      - path: /realtime
        pathType: Prefix
        backend:
          service:
            name: realtime-service
            port:
              number: 8016

---
# Horizontal Pod Autoscaler for Auth Service
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service-hpa
  namespace: bookmymovie
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80