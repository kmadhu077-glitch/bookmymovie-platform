<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyMovie - Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            overflow-x: auto;
        }
        
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .last-updated {
            opacity: 0.8;
            font-size: 0.9em;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .controls button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .controls button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .controls button.active {
            background: rgba(255, 255, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.6);
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .metric-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }
        
        .metric-card:hover {
            transform: translateY(-5px);
        }
        
        .metric-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .metric-icon {
            font-size: 2em;
            margin-right: 15px;
        }
        
        .metric-title {
            font-size: 1.1em;
            font-weight: 600;
            opacity: 0.9;
        }
        
        .metric-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .metric-change {
            font-size: 0.9em;
            opacity: 0.8;
        }
        
        .positive { color: #4CAF50; }
        .negative { color: #f44336; }
        
        .charts-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .chart-title {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
        }
        
        .performance-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .performance-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .performance-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .performance-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: between;
            align-items: center;
        }
        
        .performance-info {
            flex: 1;
        }
        
        .performance-name {
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .performance-stats {
            font-size: 0.9em;
            opacity: 0.8;
        }
        
        .performance-value {
            text-align: right;
            font-weight: bold;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            opacity: 0.7;
        }
        
        .error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.3);
            color: #ffcdd2;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }
        
        @media (max-width: 768px) {
            .charts-section {
                grid-template-columns: 1fr;
            }
            
            .performance-grid {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
        }
        
        .refresh-status {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(76, 175, 80, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>📊 BookMyMovie Analytics Dashboard</h1>
            <div class="last-updated" id="lastUpdated">Loading...</div>
        </div>
        
        <div class="controls">
            <button onclick="refreshDashboard()" id="refreshBtn">🔄 Refresh Data</button>
            <button onclick="toggleAutoRefresh()" id="autoRefreshBtn">⚡ Auto-Refresh: OFF</button>
            <button onclick="exportData()">📥 Export Data</button>
            <button onclick="showTimeRange()">📅 Time Range</button>
        </div>
        
        <div id="loadingIndicator" class="loading">
            🔄 Loading Analytics Dashboard...
        </div>
        
        <div id="errorIndicator" class="error" style="display: none;">
            ❌ Failed to load analytics data. Please check if the analytics service is running.
        </div>
        
        <div id="dashboardContent" style="display: none;">
            <!-- Key Metrics -->
            <div class="metrics-grid" id="metricsGrid">
                <!-- Metrics cards will be populated here -->
            </div>
            
            <!-- Charts Section -->
            <div class="charts-section">
                <div class="chart-card">
                    <div class="chart-title">📈 Revenue & Bookings Trend (30 Days)</div>
                    <div class="chart-container">
                        <canvas id="timeSeriesChart"></canvas>
                    </div>
                </div>
                
                <div class="chart-card">
                    <div class="chart-title">🎯 Revenue Distribution</div>
                    <div class="chart-container">
                        <canvas id="revenueChart"></canvas>
                    </div>
                </div>
            </div>
            
            <!-- Performance Section -->
            <div class="performance-grid">
                <div class="performance-card">
                    <div class="chart-title">🎬 Top Movies</div>
                    <div class="performance-list" id="topMovies">
                        <!-- Top movies will be populated here -->
                    </div>
                </div>
                
                <div class="performance-card">
                    <div class="chart-title">🏛️ Top Theaters</div>
                    <div class="performance-list" id="topTheaters">
                        <!-- Top theaters will be populated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="refresh-status" id="refreshStatus">
        Data refreshed successfully!
    </div>

    <script>
        // Global variables
        let dashboardData = null;
        let autoRefreshInterval = null;
        let timeSeriesChart = null;
        let revenueChart = null;
        
        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            loadDashboard();
        });
        
        // Load dashboard data
        async function loadDashboard() {
            const loadingIndicator = document.getElementById('loadingIndicator');
            const errorIndicator = document.getElementById('errorIndicator');
            const dashboardContent = document.getElementById('dashboardContent');
            
            loadingIndicator.style.display = 'block';
            errorIndicator.style.display = 'none';
            dashboardContent.style.display = 'none';
            
            try {
                console.log('Fetching analytics dashboard...');
                const response = await fetch('http://127.0.0.1:8010/analytics/dashboard');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                dashboardData = await response.json();
                console.log('Dashboard data loaded:', dashboardData);
                
                renderDashboard();
                
                loadingIndicator.style.display = 'none';
                dashboardContent.style.display = 'block';
                
            } catch (error) {
                console.error('Failed to load dashboard:', error);
                loadingIndicator.style.display = 'none';
                errorIndicator.style.display = 'block';
                errorIndicator.innerHTML = `❌ Failed to load analytics: ${error.message}`;
            }
        }
        
        // Render dashboard components
        function renderDashboard() {
            renderMetrics();
            renderCharts();
            renderPerformance();
            updateLastUpdated();
        }
        
        // Render key metrics
        function renderMetrics() {
            const metricsGrid = document.getElementById('metricsGrid');
            const { revenue_metrics, booking_metrics, user_metrics } = dashboardData;
            
            const metrics = [
                {
                    icon: '💰',
                    title: 'Total Revenue',
                    value: formatCurrency(revenue_metrics.total_revenue),
                    change: `${revenue_metrics.revenue_growth_rate >= 0 ? '+' : ''}${revenue_metrics.revenue_growth_rate.toFixed(1)}% this month`,
                    positive: revenue_metrics.revenue_growth_rate >= 0
                },
                {
                    icon: '🎟️',
                    title: 'Total Bookings',
                    value: formatNumber(booking_metrics.total_bookings),
                    change: `${booking_metrics.bookings_this_week} this week`,
                    positive: true
                },
                {
                    icon: '👥',
                    title: 'Total Users',
                    value: formatNumber(user_metrics.total_users),
                    change: `${user_metrics.new_users_this_month} new this month`,
                    positive: true
                },
                {
                    icon: '📊',
                    title: 'Avg Ticket Price',
                    value: formatCurrency(revenue_metrics.average_ticket_price),
                    change: `${booking_metrics.average_seats_per_booking.toFixed(1)} seats/booking`,
                    positive: true
                },
                {
                    icon: '📅',
                    title: 'Today\'s Revenue',
                    value: formatCurrency(revenue_metrics.revenue_today),
                    change: `${booking_metrics.bookings_today} bookings today`,
                    positive: true
                },
                {
                    icon: '🎯',
                    title: 'User Retention',
                    value: `${(user_metrics.user_retention_rate * 100).toFixed(1)}%`,
                    change: `${user_metrics.active_users_today} active today`,
                    positive: true
                }
            ];
            
            metricsGrid.innerHTML = metrics.map(metric => `
                <div class="metric-card">
                    <div class="metric-header">
                        <div class="metric-icon">${metric.icon}</div>
                        <div class="metric-title">${metric.title}</div>
                    </div>
                    <div class="metric-value">${metric.value}</div>
                    <div class="metric-change ${metric.positive ? 'positive' : 'negative'}">
                        ${metric.change}
                    </div>
                </div>
            `).join('');
        }
        
        // Render charts
        function renderCharts() {
            renderTimeSeriesChart();
            renderRevenueChart();
        }
        
        // Render time series chart
        function renderTimeSeriesChart() {
            const ctx = document.getElementById('timeSeriesChart').getContext('2d');
            const { time_series } = dashboardData;
            
            if (timeSeriesChart) {
                timeSeriesChart.destroy();
            }
            
            timeSeriesChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: time_series.map(d => new Date(d.date).toLocaleDateString()),
                    datasets: [
                        {
                            label: 'Revenue',
                            data: time_series.map(d => d.revenue),
                            borderColor: '#4CAF50',
                            backgroundColor: 'rgba(76, 175, 80, 0.1)',
                            tension: 0.4,
                            yAxisID: 'y'
                        },
                        {
                            label: 'Bookings',
                            data: time_series.map(d => d.bookings),
                            borderColor: '#2196F3',
                            backgroundColor: 'rgba(33, 150, 243, 0.1)',
                            tension: 0.4,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: 'white' }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: 'white' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            ticks: { 
                                color: 'white',
                                callback: function(value) {
                                    return '$' + value.toFixed(0);
                                }
                            },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            ticks: { color: 'white' },
                            grid: { drawOnChartArea: false }
                        }
                    }
                }
            });
        }
        
        // Render revenue distribution chart
        function renderRevenueChart() {
            const ctx = document.getElementById('revenueChart').getContext('2d');
            const { revenue_metrics } = dashboardData;
            
            if (revenueChart) {
                revenueChart.destroy();
            }
            
            revenueChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Today', 'This Week', 'This Month', 'Total'],
                    datasets: [{
                        data: [
                            revenue_metrics.revenue_today,
                            revenue_metrics.revenue_this_week,
                            revenue_metrics.revenue_this_month,
                            revenue_metrics.total_revenue
                        ],
                        backgroundColor: [
                            '#4CAF50',
                            '#2196F3',
                            '#FF9800',
                            '#9C27B0'
                        ],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { 
                                color: 'white',
                                padding: 20
                            }
                        }
                    }
                }
            });
        }
        
        // Render performance lists
        function renderPerformance() {
            renderTopMovies();
            renderTopTheaters();
        }
        
        // Render top movies
        function renderTopMovies() {
            const topMoviesContainer = document.getElementById('topMovies');
            const { top_movies } = dashboardData;
            
            topMoviesContainer.innerHTML = top_movies.map((movie, index) => `
                <div class="performance-item">
                    <div class="performance-info">
                        <div class="performance-name">#${index + 1} ${movie.title}</div>
                        <div class="performance-stats">
                            ${movie.total_bookings} bookings • ${(movie.occupancy_rate * 100).toFixed(1)}% occupancy
                            ${movie.average_rating ? ` • ⭐ ${movie.average_rating.toFixed(1)}` : ''}
                        </div>
                    </div>
                    <div class="performance-value">
                        ${formatCurrency(movie.total_revenue)}
                    </div>
                </div>
            `).join('');
        }
        
        // Render top theaters
        function renderTopTheaters() {
            const topTheatersContainer = document.getElementById('topTheaters');
            const { top_theaters } = dashboardData;
            
            topTheatersContainer.innerHTML = top_theaters.map((theater, index) => `
                <div class="performance-item">
                    <div class="performance-info">
                        <div class="performance-name">#${index + 1} ${theater.name}</div>
                        <div class="performance-stats">
                            ${theater.total_bookings} bookings • ${(theater.occupancy_rate * 100).toFixed(1)}% occupancy
                        </div>
                    </div>
                    <div class="performance-value">
                        ${formatCurrency(theater.total_revenue)}
                    </div>
                </div>
            `).join('');
        }
        
        // Update last updated timestamp
        function updateLastUpdated() {
            const lastUpdatedElement = document.getElementById('lastUpdated');
            const lastUpdated = new Date(dashboardData.last_updated).toLocaleString();
            lastUpdatedElement.textContent = `Last updated: ${lastUpdated}`;
        }
        
        // Utility functions
        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD'
            }).format(amount);
        }
        
        function formatNumber(number) {
            return new Intl.NumberFormat('en-US').format(number);
        }
        
        // Control functions
        async function refreshDashboard() {
            const refreshBtn = document.getElementById('refreshBtn');
            const refreshStatus = document.getElementById('refreshStatus');
            
            refreshBtn.textContent = '🔄 Refreshing...';
            refreshBtn.disabled = true;
            
            try {
                // Trigger cache refresh
                await fetch('http://127.0.0.1:8010/analytics/refresh', { method: 'POST' });
                
                // Wait a moment for cache to clear
                setTimeout(async () => {
                    await loadDashboard();
                    
                    refreshStatus.style.display = 'block';
                    setTimeout(() => {
                        refreshStatus.style.display = 'none';
                    }, 3000);
                    
                    refreshBtn.textContent = '🔄 Refresh Data';
                    refreshBtn.disabled = false;
                }, 1000);
                
            } catch (error) {
                console.error('Failed to refresh:', error);
                refreshBtn.textContent = '🔄 Refresh Data';
                refreshBtn.disabled = false;
            }
        }
        
        function toggleAutoRefresh() {
            const autoRefreshBtn = document.getElementById('autoRefreshBtn');
            
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
                autoRefreshBtn.textContent = '⚡ Auto-Refresh: OFF';
                autoRefreshBtn.classList.remove('active');
            } else {
                autoRefreshInterval = setInterval(loadDashboard, 60000); // Refresh every minute
                autoRefreshBtn.textContent = '⚡ Auto-Refresh: ON';
                autoRefreshBtn.classList.add('active');
            }
        }
        
        function exportData() {
            if (!dashboardData) return;
            
            const dataStr = JSON.stringify(dashboardData, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = `analytics_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
        
        function showTimeRange() {
            alert('Time range selector coming soon! Currently showing last 30 days.');
        }
    </script>
</body>
</html>
