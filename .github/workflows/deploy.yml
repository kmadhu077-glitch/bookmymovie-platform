# 🚀 BookMyMovie Platform - Production CI/CD Pipeline
# Complete automated deployment workflow for enterprise production

name: Deploy BookMyMovie Platform

on:
  push:
    branches: 
      - main
      - develop
  pull_request:
    branches: 
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/bookmymovie-platform

jobs:
  # Security and Code Quality Checks
  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install security tools
        run: |
          pip install bandit safety semgrep
          
      - name: Run Bandit security scan
        run: |
          bandit -r backend/ -f json -o bandit-report.json
          
      - name: Run Safety vulnerability check
        run: |
          safety check --json --output safety-report.json || true
          
      - name: Run Semgrep scan
        run: |
          semgrep --config=auto backend/ --json --output=semgrep-report.json || true
          
      - name: Upload security reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            semgrep-report.json

  # Unit and Integration Tests
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
        
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: test_bookmymovie
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
          
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx
          
      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/test_bookmymovie
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci
        run: |
          pytest tests/ -v --cov=backend --cov-report=xml --cov-report=html
          
      - name: Upload test coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          
      - name: Archive test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/

  # Build and Push Docker Images
  build:
    name: 🐳 Build Images
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          
      - name: Upload SBOM
        uses: actions/upload-artifact@v3
        with:
          name: sbom
          path: sbom.spdx.json

  # Deploy to Staging
  deploy-staging:
    name: 🚀 Deploy to Staging
    needs: [build]
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
          
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region us-west-2 --name bookmymovie-staging-cluster
          
      - name: Deploy to staging
        run: |
          # Update image tag in deployment
          IMAGE_TAG="${{ github.sha }}"
          sed -i "s|bookmymovie/platform:latest|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}|g" k8s-deployment.yaml
          
          # Apply deployment
          kubectl apply -f k8s-deployment.yaml -n bookmymovie-staging
          
          # Wait for rollout
          kubectl rollout status deployment/auth-service -n bookmymovie-staging --timeout=300s
          kubectl rollout status deployment/catalog-service -n bookmymovie-staging --timeout=300s
          kubectl rollout status deployment/booking-service -n bookmymovie-staging --timeout=300s
          
      - name: Run smoke tests
        run: |
          # Port forward for testing
          kubectl port-forward service/auth-service 8013:8013 -n bookmymovie-staging &
          sleep 10
          
          # Test health endpoints
          curl -f http://localhost:8013/health || exit 1
          
          echo "✅ Staging deployment successful!"

  # Deploy to Production
  deploy-production:
    name: 🚀 Deploy to Production
    needs: [build]
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: us-west-2
          
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region us-west-2 --name bookmymovie-production-cluster
          
      - name: Pre-deployment backup
        run: |
          # Create database backup
          kubectl exec -n bookmymovie deployment/postgres -- pg_dump -U bookmymovie bookmymovie > backup-$(date +%Y%m%d-%H%M%S).sql
          
      - name: Deploy to production
        run: |
          # Update image tag
          IMAGE_TAG="${{ github.event.inputs.image_tag || github.sha }}"
          sed -i "s|bookmymovie/platform:latest|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}|g" k8s-deployment.yaml
          
          # Rolling update deployment
          kubectl apply -f k8s-deployment.yaml -n bookmymovie
          
          # Monitor rollout
          kubectl rollout status deployment/auth-service -n bookmymovie --timeout=600s
          kubectl rollout status deployment/catalog-service -n bookmymovie --timeout=600s
          kubectl rollout status deployment/booking-service -n bookmymovie --timeout=600s
          kubectl rollout status deployment/payment-service -n bookmymovie --timeout=600s
          
      - name: Post-deployment tests
        run: |
          # Wait for services to be ready
          sleep 30
          
          # Health check all services
          services=("auth-service:8013" "catalog-service:8012" "booking-service:8014" "payment-service:8015")
          
          for service_port in "${services[@]}"; do
            IFS=':' read -r service port <<< "$service_port"
            kubectl port-forward service/$service $port:$port -n bookmymovie &
            sleep 5
            
            if curl -f http://localhost:$port/health; then
              echo "✅ $service is healthy"
            else
              echo "❌ $service health check failed"
              exit 1
            fi
            
            # Kill port-forward
            pkill -f "port-forward.*$service" || true
          done
          
      - name: Notify deployment success
        uses: 8398a7/action-slack@v3
        if: success()
        with:
          status: success
          channel: '#deployments'
          message: |
            🎉 BookMyMovie Platform successfully deployed to production!
            
            📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            🚀 Commit: ${{ github.sha }}
            👤 Author: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          
      - name: Notify deployment failure
        uses: 8398a7/action-slack@v3
        if: failure()
        with:
          status: failure
          channel: '#deployments'
          message: |
            ❌ BookMyMovie Platform deployment to production FAILED!
            
            📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            🚀 Commit: ${{ github.sha }}
            👤 Author: ${{ github.actor }}
            
            Please check the deployment logs and take action.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Performance Testing
  performance-test:
    name: 📊 Performance Test
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install k6
        run: |
          curl https://github.com/grafana/k6/releases/download/v0.46.0/k6-v0.46.0-linux-amd64.tar.gz -L | tar xvz --strip-components 1
          
      - name: Run performance tests
        run: |
          # Create k6 test script
          cat > performance-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          
          export let options = {
            stages: [
              { duration: '2m', target: 20 },
              { duration: '5m', target: 20 },
              { duration: '2m', target: 40 },
              { duration: '5m', target: 40 },
              { duration: '2m', target: 0 },
            ],
            thresholds: {
              http_req_duration: ['p(95)<500'],
              http_req_failed: ['rate<0.1'],
            },
          };
          
          export default function () {
            const baseUrl = 'https://api-staging.bookmymovie.com';
            
            // Test health endpoints
            let response = http.get(`${baseUrl}/auth/health`);
            check(response, {
              'auth health check': (r) => r.status === 200,
            });
            
            response = http.get(`${baseUrl}/catalog/health`);
            check(response, {
              'catalog health check': (r) => r.status === 200,
            });
            
            sleep(1);
          }
          EOF
          
          # Run the test
          ./k6 run performance-test.js
          
      - name: Upload performance results
        uses: actions/upload-artifact@v3
        with:
          name: performance-results
          path: k6-results.json

  # Security Monitoring
  security-monitor:
    name: 🔍 Security Monitor
    needs: [deploy-production]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
          
      - name: Container security scan
        run: |
          # Run additional container security checks
          echo "Running container security verification..."
          # This would integrate with your security monitoring tools

  # Rollback capability
  rollback:
    name: 🔄 Rollback
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'rollback'
    steps:
      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        
      - name: Rollback deployment
        run: |
          kubectl rollout undo deployment/auth-service -n bookmymovie
          kubectl rollout undo deployment/catalog-service -n bookmymovie  
          kubectl rollout undo deployment/booking-service -n bookmymovie
          kubectl rollout undo deployment/payment-service -n bookmymovie
          
          echo "✅ Rollback completed"